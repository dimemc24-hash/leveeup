<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Clue Photo - Polaroid/camera icon -->
  <!-- Polaroid frame - slightly tilted -->
  <g transform="rotate(-5, 50, 50)">
    <!-- Outer frame -->
    <rect x="18" y="10" width="64" height="78" rx="2" fill="#f5f0e1" stroke="#8b6914" stroke-width="1.5"/>
    <!-- Photo area -->
    <rect x="24" y="16" width="52" height="48" rx="1" fill="#4a7c23" opacity="0.3"/>
    <!-- Simple mountain/tree scene in photo -->
    <path d="M24 64 L38 36 L48 50 L56 34 L76 64 Z" fill="#2d5016" opacity="0.6"/>
    <path d="M24 64 L34 46 L44 56 L52 42 L76 64 Z" fill="#4a7c23" opacity="0.5"/>
    <!-- Moon/circle in sky -->
    <circle cx="64" cy="28" r="6" fill="#d4a843" opacity="0.5"/>
    <!-- Mysterious figure silhouette in photo -->
    <path d="M46 52 Q46 46 48 42 Q50 40 52 42 Q54 46 54 52 L54 64 L46 64 Z" fill="#3d2b1f" opacity="0.7"/>
    <!-- Question mark on photo -->
    <text x="50" y="58" text-anchor="middle" font-family="serif" font-size="14" fill="#d4a843" font-weight="bold" opacity="0.6">?</text>
  </g>
  <!-- Tape strip on top -->
  <rect x="38" y="4" width="24" height="10" rx="1" fill="#d4a843" opacity="0.4" transform="rotate(-5, 50, 9)"/>
</svg>
