  <circle cx="40" cy="56" r="1.5" fill="none" stroke="#8b6914" stroke-width="0.5" opacity="0.4"/>
  <!-- Label on jar -->
  <rect x="36" y="34" width="28" height="12" rx="1" fill="#f5f0e1" stroke="#8b6914" stroke-width="0.8"/>
  <path d="M39 38 L61 38" stroke="#3d2b1f" stroke-width="0.6" opacity="0.5"/>
  <path d="M39 42 L54 42" stroke="#3d2b1f" stroke-width="0.6" opacity="0.5"/>
  <!-- Glass highlight -->
