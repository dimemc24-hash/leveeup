  <path d="M32 50 Q36 47 42 50 Q48 53 54 50 Q60 47 64 50 Q68 53 68 78 Q68 86 60 86 L40 86 Q32 86 32 78 Z" fill="#4a7c23" opacity="0.4"/>
  <!-- Mysterious specimen floating inside -->
