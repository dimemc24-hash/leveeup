<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Clue Sketch - Pencil sketch style drawing icon -->
  <!-- Paper/notepad background -->
  <rect x="18" y="12" width="64" height="76" rx="3" fill="#f5f0e1" stroke="#8b6914" stroke-width="2"/>
  <!-- Sketch lines (like a rough drawing) -->
  <path d="M30 35 Q40 25 55 30 Q65 34 60 45 Q55 55 42 52 Q30 48 30 35 Z" fill="none" stroke="#3d2b1f" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.7"/>
  <!-- More sketch marks -->
  <path d="M35 60 Q45 58 55 62" stroke="#3d2b1f" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M32 66 Q42 64 58 68" stroke="#3d2b1f" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M35 72 Q42 71 50 73" stroke="#3d2b1f" stroke-width="1.2" fill="none" opacity="0.5"/>
  <!-- Pencil -->
  <g transform="rotate(-45, 75, 75)">
    <rect x="70" y="50" width="6" height="32" rx="1" fill="#d4a843"/>
    <polygon points="70,82 73,90 76,82" fill="#3d2b1f"/>
    <rect x="70" y="50" width="6" height="5" fill="#8b6914"/>
    <!-- Eraser -->
    <rect x="70" y="46" width="6" height="5" rx="1" fill="#d4a843" opacity="0.6"/>
  </g>
</svg>
