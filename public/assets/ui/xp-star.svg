<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- XP Star - Star icon for experience points -->
  <!-- Star glow -->
  <circle cx="50" cy="48" r="36" fill="#d4a843" opacity="0.15"/>
  <!-- Star shape -->
  <polygon points="50,8 61,36 92,36 67,56 76,86 50,68 24,86 33,56 8,36 39,36" fill="#d4a843"/>
  <!-- Star inner highlight -->
  <polygon points="50,16 58,36 78,36 62,52 68,74 50,60 32,74 38,52 22,36 42,36" fill="#f5f0e1" opacity="0.3"/>
  <!-- Star outline for definition -->
  <polygon points="50,8 61,36 92,36 67,56 76,86 50,68 24,86 33,56 8,36 39,36" fill="none" stroke="#8b6914" stroke-width="2"/>
  <!-- Center sparkle -->
  <circle cx="50" cy="44" r="3" fill="#f5f0e1" opacity="0.5"/>
  <!-- Small sparkle accents -->
  <path d="M50 4 L50 0" stroke="#d4a843" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M94 36 L98 36" stroke="#d4a843" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M78 88 L80 92" stroke="#d4a843" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M22 88 L20 92" stroke="#d4a843" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M6 36 L2 36" stroke="#d4a843" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
