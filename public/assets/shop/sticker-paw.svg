<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Paw Print Sticker -->
  <!-- Sticker background circle -->
  <circle cx="50" cy="50" r="44" fill="#f5f0e1" stroke="#d4a843" stroke-width="2.5"/>
  <!-- Sticker slightly peeling effect -->
  <path d="M82 70 Q86 66 88 60 Q90 56 88 54" fill="#f5f0e1" stroke="#d4a843" stroke-width="1" opacity="0.5"/>
  <!-- Main pad -->
  <ellipse cx="50" cy="58" rx="14" ry="12" fill="#4a7c23"/>
  <!-- Pad highlight -->
  <ellipse cx="48" cy="56" rx="8" ry="6" fill="#6b8e23" opacity="0.4"/>
  <!-- Toe pads - 3 toes (simplified cute version) -->
  <circle cx="34" cy="38" r="7" fill="#4a7c23"/>
  <circle cx="50" cy="32" r="7" fill="#4a7c23"/>
  <circle cx="66" cy="38" r="7" fill="#4a7c23"/>
  <!-- Toe highlights -->
  <circle cx="33" cy="37" r="3.5" fill="#6b8e23" opacity="0.4"/>
  <circle cx="49" cy="31" r="3.5" fill="#6b8e23" opacity="0.4"/>
  <circle cx="65" cy="37" r="3.5" fill="#6b8e23" opacity="0.4"/>
  <!-- Sparkle/shine marks (sticker effect) -->
  <path d="M18 22 L20 18 L22 22 L18 20 L22 20 Z" fill="#d4a843" opacity="0.6"/>
  <path d="M76 18 L78 14 L80 18 L76 16 L80 16 Z" fill="#d4a843" opacity="0.6"/>
  <path d="M80 74 L82 70 L84 74 L80 72 L84 72 Z" fill="#d4a843" opacity="0.5"/>
</svg>
