<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Leather Journal/Notebook -->
  <!-- Journal shadow -->
  <rect x="20" y="12" width="62" height="80" rx="3" fill="#3d2b1f" opacity="0.3" transform="translate(2,2)"/>
  <!-- Journal cover -->
  <rect x="18" y="10" width="62" height="80" rx="3" fill="#8b6914"/>
  <!-- Leather texture highlight -->
  <rect x="20" y="12" width="58" height="76" rx="2" fill="#d4a843" opacity="0.2"/>
  <!-- Spine -->
  <rect x="18" y="10" width="8" height="80" rx="2" fill="#3d2b1f" opacity="0.4"/>
  <!-- Spine stitching -->
  <path d="M22 18 L22 22 M22 28 L22 32 M22 38 L22 42 M22 48 L22 52 M22 58 L22 62 M22 68 L22 72 M22 78 L22 82" stroke="#d4a843" stroke-width="1" stroke-linecap="round"/>
  <!-- Cover embossed border -->
  <rect x="30" y="20" width="44" height="60" rx="2" fill="none" stroke="#3d2b1f" stroke-width="1" opacity="0.3"/>
  <!-- Title area -->
  <rect x="34" y="30" width="36" height="18" rx="1" fill="#3d2b1f" opacity="0.15"/>
  <!-- Title text lines -->
  <path d="M38 36 L66 36" stroke="#3d2b1f" stroke-width="1.2" opacity="0.4"/>
  <path d="M42 40 L62 40" stroke="#3d2b1f" stroke-width="1" opacity="0.3"/>
  <path d="M44 44 L60 44" stroke="#3d2b1f" stroke-width="0.8" opacity="0.25"/>
  <!-- Small embossed compass rose -->
  <circle cx="52" cy="62" r="8" fill="none" stroke="#3d2b1f" stroke-width="1" opacity="0.3"/>
  <path d="M52 54 L52 70" stroke="#3d2b1f" stroke-width="0.8" opacity="0.3"/>
  <path d="M44 62 L60 62" stroke="#3d2b1f" stroke-width="0.8" opacity="0.3"/>
  <path d="M52 55 L54 60 L52 58 L50 60 Z" fill="#3d2b1f" opacity="0.3"/>
  <!-- Strap/clasp -->
  <rect x="76" y="42" width="10" height="16" rx="2" fill="#3d2b1f" opacity="0.5"/>
  <circle cx="80" cy="50" r="2" fill="#d4a843"/>
  <!-- Page edges visible -->
  <path d="M78 14 L78 86" stroke="#f5f0e1" stroke-width="2" opacity="0.6"/>
  <path d="M77" stroke="#f5f0e1" stroke-width="1" opacity="0.3"/>
</svg>
