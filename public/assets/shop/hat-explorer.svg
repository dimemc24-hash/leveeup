<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Explorer/Safari Hat -->
  <!-- Hat brim -->
  <ellipse cx="50" cy="62" rx="42" ry="10" fill="#8b6914"/>
  <ellipse cx="50" cy="60" rx="42" ry="10" fill="#d4a843"/>
  <!-- Brim edge highlight -->
  <ellipse cx="50" cy="60" rx="40" ry="8" fill="none" stroke="#8b6914" stroke-width="1" opacity="0.5"/>
  <!-- Hat crown -->
  <path d="M30 60 Q30 38 35 30 Q40 22 50 20 Q60 22 65 30 Q70 38 70 60" fill="#d4a843"/>
  <!-- Crown crease/dent -->
  <path d="M34 42 Q42 36 50 38 Q58 36 66 42" stroke="#8b6914" stroke-width="1.5" fill="none"/>
  <!-- Hat band -->
  <rect x="30" y="52" width="40" height="6" rx="1" fill="#3d2b1f"/>
  <!-- Band buckle -->
  <rect x="46" y="51" width="8" height="8" rx="1" fill="#d4a843" stroke="#8b6914" stroke-width="1"/>
  <rect x="48" y="53" width="4" height="4" rx="0.5" fill="#3d2b1f"/>
  <!-- Shadow on crown -->
  <path d="M35 30 Q40 24 50 22 Q46 26 42 32 Q38 38 36 44" fill="#8b6914" opacity="0.3"/>
  <!-- Small feather in band -->
  <path d="M62 52 Q68 44 72 38 Q74 34 72 36 Q70 40 66 48 Q64 50 62 52" fill="#4a7c23" opacity="0.7"/>
  <path d="M66 48 Q70 42 74 36" stroke="#2d5016" stroke-width="0.5" fill="none" opacity="0.5"/>
</svg>
