  <path d="M16 18 Q14 22 12 26" stroke="#2d5016" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M24 22 Q22 26 20 30" stroke="#2d5016" stroke-width="0.8" fill="none" opacity="0.4"/>
