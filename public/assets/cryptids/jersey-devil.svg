<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Jersey Devil - Winged, hooved creature with forked tail -->
  <!-- Wings -->
  <path d="M42 40 Q30 28 18 18 Q14 16 12 20 Q14 26 20 32 Q28 38 38 44 Z" fill="#3d2b1f"/>
  <path d="M58 40 Q70 28 82 18 Q86 16 88 20 Q86 26 80 32 Q72 38 62 44 Z" fill="#3d2b1f"/>
  <!-- Wing bone lines -->
  <path d="M38 42 L20 24" stroke="#2d5016" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M62 42 L80 24" stroke="#2d5016" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Body - lean and angular -->
  <path d="M44 38 Q42 48 42 56 Q42 64 44 72 L56 72 Q58 64 58 56 Q58 48 56 38 Z" fill="#3d2b1f"/>
  <!-- Head - horse-like elongated -->
  <path d="M44 38 Q44 30 46 24 Q48 18 50 14 Q52 18 54 24 Q56 30 56 38 Z" fill="#3d2b1f"/>
  <!-- Snout -->
  <path d="M47 22 Q48 16 50 12 Q52 16 53 22 Q52 24 50 25 Q48 24 47 22" fill="#2d5016"/>
  <!-- Horns -->
  <path d="M46 24 L42 14 L44 12" stroke="#3d2b1f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M54 24 L58 14 L56 12" stroke="#3d2b1f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="47" cy="28" r="2" fill="#d4a843"/>
  <circle cx="53" cy="28" r="2" fill="#d4a843"/>
  <circle cx="47" cy="28" r="0.8" fill="#f5f0e1"/>
  <circle cx="53" cy="28" r="0.8" fill="#f5f0e1"/>
  <!-- Legs - thin with hooves -->
  <path d="M46 70 L44 82 L42 90" stroke="#3d2b1f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M54 70 L56 82 L58 90" stroke="#3d2b1f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Hooves -->
  <path d="M40 89 Q42 92 44 92 Q44 90 42 88" fill="#3d2b1f"/>
  <path d="M56 89 Q58 92 60 92 Q60 90 58 88" fill="#3d2b1f"/>
  <!-- Forked tail -->
  <path d="M50 72 Q54 78 58 82 Q62 86 66 84" stroke="#3d2b1f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M64 84 L68 80" stroke="#3d2b1f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M64 84 L68 88" stroke="#3d2b1f" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
