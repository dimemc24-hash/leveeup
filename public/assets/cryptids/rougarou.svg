<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rougarou - Wolf-like creature, Louisiana bayou theme -->
  <!-- Bayou moon backdrop -->
  <circle cx="75" cy="20" r="12" fill="#d4a843" opacity="0.25"/>
  <!-- Body - wolf standing upright -->
  <path d="M40 90 L42 68 Q43 55 46 48 Q48 42 50 38 Q52 42 54 48 Q57 55 58 68 L60 90 Z" fill="#3d2b1f"/>
  <!-- Head - wolf snout -->
  <path d="M43 38 Q42 32 44 26 Q46 22 50 18 Q54 22 56 26 Q58 32 57 38 Z" fill="#3d2b1f"/>
  <!-- Snout -->
  <path d="M46 30 Q48 26 50 22 Q52 26 54 30 Q52 32 50 33 Q48 32 46 30 Z" fill="#2d5016"/>
  <!-- Ears - pointed -->
  <path d="M44 26 L40 14 L46 22" fill="#3d2b1f"/>
  <path d="M56 26 L60 14 L54 22" fill="#3d2b1f"/>
  <!-- Eyes - glowing -->
  <circle cx="46" cy="28" r="2" fill="#d4a843"/>
  <circle cx="54" cy="28" r="2" fill="#d4a843"/>
  <circle cx="46" cy="28" r="0.8" fill="#f5f0e1"/>
  <circle cx="54" cy="28" r="0.8" fill="#f5f0e1"/>
  <!-- Arms/claws -->
  <path d="M43 48 Q34 52 28 58 Q26 60 28 62 L32 60 Q36 56 42 52" fill="#3d2b1f"/>
  <path d="M57 48 Q66 52 72 58 Q74 60 72 62 L68 60 Q64 56 58 52" fill="#3d2b1f"/>
  <!-- Claws on hands -->
  <path d="M26 60 L24 58 M28 62 L25 61 M29 60 L27 57" stroke="#3d2b1f" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M74 60 L76 58 M72 62 L75 61 M71 60 L73 57" stroke="#3d2b1f" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M55 75 Q62 72 68 68 Q74 65 76 62" stroke="#3d2b1f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Fur texture lines -->
  <path d="M46 40 L44 44" stroke="#2d5016" stroke-width="0.8" opacity="0.5"/>
  <path d="M54 40 L56 44" stroke="#2d5016" stroke-width="0.8" opacity="0.5"/>
  <path d="M48 50 L46 54" stroke="#2d5016" stroke-width="0.8" opacity="0.5"/>
  <!-- Feet -->
  <path d="M39 90 Q38 93 40 95 Q43 95 44 92 L42 90" fill="#3d2b1f"/>
  <path d="M58 90 Q57 93 58 95 Q61 95 62 92 L60 90" fill="#3d2b1f"/>
</svg>
